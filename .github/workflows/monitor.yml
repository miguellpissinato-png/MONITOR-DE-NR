name: Monitor Diário — SST e DOU

on:
  # O cron do GitHub é BEST-EFFORT: atrasa e às vezes simplesmente não roda.
  # Ele fica aqui só como rede de segurança. O disparo confiável deve vir de
  # um agendador externo via repository_dispatch (ver README).
  schedule:
    - cron: '0 9 * * 1-5'
    - cron: '0 11 * * 1-5'
    - cron: '0 13 * * 1-5'
  repository_dispatch:
    types: [monitor]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo da execução manual'
        required: false
        default: 'Verificação manual'
      dry_run:
        description: 'Só verificar, sem gravar o estado no repositório'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Duas execuções simultâneas disputariam o push do state.json. Serializa.
concurrency:
  group: monitor-sst
  cancel-in-progress: false

jobs:
  monitor-sst:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do relatório
        if: ${{ !inputs.dry_run }}
        run: pip install --quiet anthropic reportlab

      - name: Executar monitoramento
        id: monitor
        run: |
          set -uo pipefail
          for tentativa in 1 2 3; do
            echo "--- Tentativa $tentativa de 3 ---"
            if python scripts/check_nr.py; then
              exit 0
            fi
            [ "$tentativa" -lt 3 ] && echo "Aguardando 60s..." && sleep 60
          done
          echo "::error::As 3 tentativas falharam — ao menos uma fonte crítica está inacessível."
          exit 1

      # O relatório é uma camada extra: se falhar, não derruba o monitoramento,
      # que é a função essencial. Sem o secret ANTHROPIC_API_KEY o script apenas
      # avisa e sai com sucesso.
      - name: Gerar relatório de análise
        if: success() && !inputs.dry_run
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/gerar_relatorio.py

      # Roda mesmo se o passo acima falhou: o state.json já contém o registro
      # da falha, e é ele que faz o painel exibir "DESATUALIZADO".
      - name: Salvar estado
        if: always() && !inputs.dry_run
        run: |
          set -euo pipefail
          git config user.name  "Monitor SST Bot"
          git config user.email "monitor-sst@github-actions"
          git add data/state.json relatorios/ 2>/dev/null || git add data/state.json
          if git diff --cached --quiet; then
            echo "Nada mudou no estado."
            exit 0
          fi
          git commit -m "chore: monitoramento SST $(date -u +'%Y-%m-%d %H:%M UTC')"
          for tentativa in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push falhou (tentativa $tentativa) — nova tentativa em 10s..."
            sleep 10
          done
          echo "::error::Não foi possível gravar o state.json."
          exit 1
